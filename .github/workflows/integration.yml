name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  neo4j:
    name: Neo4j connectivity and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      JAWS_NEO4J_MIGRATION_TEST_DATABASE: captures
    services:
      neo4j:
        image: neo4j:5.26.28-community-ubi10
        env:
          NEO4J_AUTH: neo4j/ci-${{ github.run_id }}-${{ github.run_attempt }}
          NEO4J_initial_dbms_default__database: captures
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints/py312-direct.txt
            pyproject.toml
            requirements-dev.txt
      - name: Install Neo4j test profile
        run: >-
          python -m pip install --constraint constraints/py312-direct.txt
          ".[dev,neo4j]"
      - name: Wait for Neo4j
        run: |
          python - <<'PY'
          import os
          import time

          from neo4j import GraphDatabase

          error = None
          for _ in range(60):
              try:
                  with GraphDatabase.driver(
                      os.environ["NEO4J_URI"],
                      auth=(os.environ["NEO4J_USERNAME"], os.environ["NEO4J_PASSWORD"]),
                  ) as driver:
                      driver.verify_connectivity()
                  break
              except Exception as exc:
                  error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Neo4j did not become ready: {error}")
          PY
      - name: Run Neo4j tier
        run: python -m pytest -m neo4j -rs

  capture-tooling:
    name: Capture dependencies and tshark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints/py312-direct.txt
            pyproject.toml
            requirements-dev.txt
      - name: Install tshark
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes tshark
      - name: Install capture test profile
        run: >-
          python -m pip install --constraint constraints/py312-direct.txt
          ".[dev,capture]"
      - name: Probe capture boundary
        run: |
          tshark --version
          python -c "import pyshark, shutil; assert shutil.which('tshark')"
