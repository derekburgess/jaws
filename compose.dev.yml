name: jaws-dev

x-build-args: &build-args
  SOURCE_REVISION: ${JAWS_SOURCE_REVISION:-unknown}
  PACKAGE_VERSION: ${JAWS_PACKAGE_VERSION:-3.0.0}
  BUILD_DATE: ${JAWS_BUILD_DATE:-unknown}

x-python-service: &python-service
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=256m,mode=1777
  networks: [jaws-core]
  environment: &python-environment
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USERNAME: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?export NEO4J_PASSWORD}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-captures}
    JAWS_ARTIFACT_ROOT: /var/lib/jaws/artifacts
    JAWS_CONTAINER_DIGEST: ${JAWS_ANALYZER_IMAGE_DIGEST:-}

services:
  neo4j:
    image: neo4j:5.26.28-community-ubi10@sha256:f0a9509090d06027749f647314bae5a549f95192b4ac7080104226e448fd7793
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?export NEO4J_PASSWORD}
      JAWS_NEO4J_HEALTH_PASSWORD: ${NEO4J_PASSWORD:?export NEO4J_PASSWORD}
      NEO4J_initial_dbms_default__database: ${NEO4J_DATABASE:-captures}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks: [jaws-core]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${JAWS_NEO4J_HEALTH_PASSWORD}\" 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    <<: *python-service
    restart: "no"
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: analyzer
      args: *build-args
    entrypoint: [jaws-schema]
    command: [migrate, --database, "${NEO4J_DATABASE:-captures}"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - artifacts:/var/lib/jaws/artifacts

  analyzer:
    <<: *python-service
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: analyzer
      args: *build-args
    command: [serve-health, --role, analyzer, --host, 0.0.0.0, --port, "8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts:/var/lib/jaws/artifacts
    healthcheck:
      test: [CMD, jaws-runtime, probe, --host, 127.0.0.1, --port, "8080"]
      interval: 10s
      timeout: 3s
      retries: 5

  mcp:
    <<: *python-service
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: mcp
      args: *build-args
    environment:
      <<: *python-environment
      JAWS_CONTAINER_DIGEST: ${JAWS_MCP_IMAGE_DIGEST:-}
      JAWS_ARTIFACT_ROOT: /var/lib/jaws/mcp-jobs
      JAWS_MCP_CATALOG: ${JAWS_MCP_CATALOG:-}
    command: [--host, 0.0.0.0, --port, "8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${JAWS_MCP_PORT:-8765}:8765"
    volumes:
      - artifacts:/var/lib/jaws/artifacts:ro
      - mcp-jobs:/var/lib/jaws/mcp-jobs
    healthcheck:
      test: [CMD, jaws-runtime, probe, --host, 127.0.0.1, --port, "8765"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  neo4j-data:
  neo4j-logs:
  artifacts:
  mcp-jobs:
  model-cache:

networks:
  jaws-core:
    internal: true
