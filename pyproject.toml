[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "JAWS"
version = "2.0.0"
description = "Packet capture and anomaly detection system with MCP server"
readme = "README.md"
license = "GPL-2.0-only"
keywords = ["networking", "analysis", "visualization", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
# Dependencies stay in requirements.txt (the single source of truth); see
# [tool.setuptools.dynamic] below.
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/derekburgess/jaws"

[project.scripts]
jaws-guide = "jaws.jaws_guide:main"
jaws-capture = "jaws.jaws_capture:main"
jaws-ipinfo = "jaws.jaws_ipinfo:main"
jaws-compute = "jaws.jaws_compute:main"
jaws-finder = "jaws.jaws_finder:main"
jaws-utils = "jaws.jaws_utils:main"
jaws-mcp = "jaws_mcp.server:main"

[tool.setuptools]
packages = ["jaws", "jaws_mcp"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# conftest helpers are imported by name from the test modules.
pythonpath = ["tests"]
markers = [
    "neo4j: requires a live Neo4j instance (deselected by default)",
    "recall: synthetic-injection detection benchmark (deselected by default)",
]
addopts = "-m 'not neo4j and not recall'"
